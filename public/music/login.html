<!DOCTYPE html>
<html lang="zh-CN" class="theme-dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LX Music Web - 登录</title>
    <script src="/js/config.js"></script>
    <script>
        (function() {
            var name = (window.CONFIG && window.CONFIG['player.name']) || 'LX Music Web';
            document.title = name + ' - 登录';
        })();
    </script>
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="css/utilities.css">
    <style>
        :root {
            --primary: #10b981;
            --primary-glow: rgba(16, 185, 129, 0.4);
            --accent: #06b6d4;
            --accent-glow: rgba(6, 182, 212, 0.35);
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        input {
            user-select: text;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
            transition: background 0.4s ease, color 0.4s ease;
        }

        /* ===== 暗色模式 (Dark Theme) ===== */
        html.theme-dark body {
            background: #090d16;
            color: #f3f4f6;
        }

        html.theme-dark .bg-grid-mask {
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }

        html.theme-dark .glass-card {
            background: rgba(18, 24, 38, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 
                0 30px 60px -12px rgba(0, 0, 0, 0.7),
                0 18px 36px -18px rgba(0, 0, 0, 0.8),
                inset 0 1px 0 rgba(255, 255, 255, 0.18),
                inset 0 0 20px rgba(16, 185, 129, 0.04);
        }

        html.theme-dark .modern-input {
            background: rgba(11, 15, 25, 0.7);
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            color: #ffffff;
        }

        html.theme-dark .modern-input:hover {
            border-color: rgba(255, 255, 255, 0.18);
            background: rgba(15, 21, 34, 0.85);
        }

        html.theme-dark .modern-input:focus {
            border-color: #10b981;
            background: rgba(16, 24, 39, 0.95);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.18), 0 4px 20px rgba(16, 185, 129, 0.15);
        }

        html.theme-dark .card-title {
            color: #ffffff;
        }

        html.theme-dark .segmented-bg {
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        html.theme-dark .floating-note {
            color: rgba(255, 255, 255, 0.12);
            text-shadow: 0 0 12px rgba(16, 185, 129, 0.25);
        }

        /* ===== 亮色模式 (Light Theme) ===== */
        html.theme-light body {
            background: #f0fdf4;
            color: #1e293b;
        }

        html.theme-light .bg-grid-mask {
            background-image: 
                linear-gradient(to right, rgba(16, 185, 129, 0.06) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(16, 185, 129, 0.06) 1px, transparent 1px);
        }

        html.theme-light .glass-card {
            background: rgba(255, 255, 255, 0.82);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 
                0 30px 60px -12px rgba(16, 185, 129, 0.18),
                0 18px 36px -18px rgba(0, 0, 0, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 1),
                inset 0 0 20px rgba(16, 185, 129, 0.06);
        }

        html.theme-light .modern-input {
            background: rgba(248, 250, 252, 0.85);
            border: 1.5px solid rgba(203, 213, 225, 0.8);
            color: #0f172a;
        }

        html.theme-light .modern-input::placeholder {
            color: #94a3b8;
        }

        html.theme-light .modern-input:hover {
            border-color: rgba(16, 185, 129, 0.4);
            background: #ffffff;
        }

        html.theme-light .modern-input:focus {
            border-color: #10b981;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15), 0 4px 16px rgba(16, 185, 129, 0.12);
        }

        html.theme-light .card-title {
            color: #0f172a;
        }

        html.theme-light .segmented-bg {
            background: rgba(241, 245, 249, 0.9);
            border: 1px solid rgba(203, 213, 225, 0.7);
        }

        html.theme-light #mode-desc,
        html.theme-light #footer-tip,
        html.theme-light .sub-text {
            color: #64748b !important;
        }

        html.theme-light .floating-note {
            color: rgba(16, 185, 129, 0.18);
            text-shadow: 0 0 12px rgba(16, 185, 129, 0.18);
        }

        /* 动态极光渐变背景与微网格 */
        .ambient-canvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .aurora-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.55;
            mix-blend-mode: screen;
            animation: floatAurora 18s ease-in-out infinite alternate;
        }

        html.theme-light .aurora-blob {
            opacity: 0.4;
            mix-blend-mode: normal;
        }

        .aurora-1 {
            width: 520px;
            height: 520px;
            background: radial-gradient(circle, #059669 0%, rgba(16, 185, 129, 0.4) 50%, transparent 70%);
            top: -10%;
            left: -5%;
            animation-duration: 20s;
        }

        .aurora-2 {
            width: 580px;
            height: 580px;
            background: radial-gradient(circle, #0284c7 0%, rgba(6, 182, 212, 0.4) 50%, transparent 70%);
            bottom: -15%;
            right: -10%;
            animation-duration: 24s;
            animation-delay: -5s;
        }

        .aurora-3 {
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, #6366f1 0%, rgba(99, 102, 241, 0.3) 50%, transparent 70%);
            top: 45%;
            left: 35%;
            animation-duration: 16s;
            animation-delay: -9s;
        }

        @keyframes floatAurora {
            0% {
                transform: translate(0, 0) scale(1) rotate(0deg);
            }
            50% {
                transform: translate(50px, 40px) scale(1.1) rotate(45deg);
            }
            100% {
                transform: translate(-30px, -20px) scale(0.95) rotate(-30deg);
            }
        }

        /* 动态背景微网格遮罩 */
        .bg-grid-mask {
            position: fixed;
            inset: 0;
            background-size: 40px 40px;
            mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, #000 60%, transparent 100%);
            pointer-events: none;
            z-index: 1;
            transition: background 0.4s ease;
        }

        /* 动态从下向上升腾漂浮的音乐图标容器 */
        #notes-container {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
        }

        .floating-note {
            position: absolute;
            bottom: -80px;
            top: auto;
            opacity: 0;
            pointer-events: none;
            will-change: transform, opacity;
            animation: noteAscend 12s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes noteAscend {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg) scale(0.65);
                opacity: 0;
            }
            15% {
                opacity: 0.85;
                transform: translateY(-15vh) translateX(14px) rotate(45deg) scale(0.85);
            }
            50% {
                opacity: 0.85;
                transform: translateY(-50vh) translateX(-16px) rotate(180deg) scale(1.02);
            }
            85% {
                opacity: 0.75;
                transform: translateY(-85vh) translateX(12px) rotate(315deg) scale(1.1);
            }
            100% {
                transform: translateY(calc(-100vh - 120px)) translateX(0) rotate(360deg) scale(1.15);
                opacity: 0;
            }
        }

        /* 动态 Canvas 粒子背景 */
        #particles-canvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
        }

        /* 鼠标微光跟随层 */
        #cursor-glow {
            position: fixed;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, rgba(6, 182, 212, 0.04) 45%, transparent 70%);
            pointer-events: none;
            transform: translate(-50%, -50%);
            transition: opacity 0.3s ease;
            z-index: 2;
        }

        /* 磨砂玻璃卡片 */
        .glass-card {
            backdrop-filter: blur(28px) saturate(190%);
            -webkit-backdrop-filter: blur(28px) saturate(190%);
            transition: background 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
        }

        /* 左上角精美主题切换 Toggle (Floating Capsule) */
        .theme-toggle-btn {
            position: fixed;
            top: 24px;
            left: 24px;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 14px;
            border-radius: 9999px;
            cursor: pointer;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
        }

        html.theme-dark .theme-toggle-btn {
            background: rgba(18, 24, 38, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #f3f4f6;
            box-shadow: 0 8px 24px -4px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        html.theme-light .theme-toggle-btn {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(203, 213, 225, 0.8);
            color: #0f172a;
            box-shadow: 0 8px 20px -4px rgba(16, 185, 129, 0.15), inset 0 1px 0 #ffffff;
        }

        .theme-toggle-btn:hover {
            transform: translateY(-1.5px) scale(1.03);
            border-color: #10b981;
        }

        .theme-toggle-btn:active {
            transform: translateY(0.5px) scale(0.97);
        }

        .theme-icon-box {
            position: relative;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .theme-icon {
            position: absolute;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        html.theme-dark .icon-sun {
            transform: rotate(90deg) scale(0);
            opacity: 0;
        }
        html.theme-dark .icon-moon {
            transform: rotate(0) scale(1);
            opacity: 1;
            color: #38bdf8;
        }

        html.theme-light .icon-sun {
            transform: rotate(0) scale(1);
            opacity: 1;
            color: #f59e0b;
        }
        html.theme-light .icon-moon {
            transform: rotate(-90deg) scale(0);
            opacity: 0;
        }

        /* 选项卡胶囊滑块 */
        .tab-pill {
            position: absolute;
            top: 4px;
            bottom: 4px;
            width: calc(50% - 6px);
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.9), rgba(5, 150, 105, 0.9));
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 1;
        }

        .tab-btn {
            position: relative;
            z-index: 2;
            transition: color 0.3s ease;
        }

        /* 输入框高质感交互 */
        .input-wrapper {
            position: relative;
            transition: all 0.3s ease;
        }

        .modern-input {
            width: 100%;
            border-radius: 14px;
            padding: 13px 44px 13px 46px;
            font-size: 16px;
            outline: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(156, 163, 175, 0.7);
            transition: color 0.25s ease, transform 0.25s ease;
            pointer-events: none;
        }

        .modern-input:focus + .input-icon,
        .input-wrapper:focus-within .input-icon {
            color: #10b981;
            transform: translateY(-50%) scale(1.1);
        }

        .input-action-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(156, 163, 175, 0.7);
            cursor: pointer;
            padding: 6px;
            transition: all 0.2s ease;
            background: transparent;
            border: none;
            outline: none;
        }

        .input-action-btn:hover {
            color: #10b981;
            transform: translateY(-50%) scale(1.12);
        }

        /* 渐变流光按钮 */
        .btn-gradient-submit {
            background: linear-gradient(135deg, #10b981 0%, #059669 50%, #0284c7 100%);
            background-size: 200% 200%;
            border: none;
            box-shadow: 0 8px 24px -4px rgba(16, 185, 129, 0.45);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-gradient-submit:hover:not(:disabled) {
            background-position: 100% 0%;
            box-shadow: 0 12px 30px -4px rgba(16, 185, 129, 0.6), 0 4px 12px rgba(6, 182, 212, 0.4);
            transform: translateY(-1.5px) scale(1.01);
        }

        .btn-gradient-submit:active:not(:disabled) {
            transform: translateY(0.5px) scale(0.985);
        }

        .btn-gradient-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            filter: grayscale(0.2);
        }

        /* 模式切换过渡容器 */
        .form-panel {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .form-panel.hidden-panel {
            display: none;
            opacity: 0;
            transform: translateY(8px);
        }

        .form-panel.active-panel {
            display: block;
            opacity: 1;
            transform: translateY(0);
            animation: fadeInSlide 0.3s ease forwards;
        }

        @keyframes fadeInSlide {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        input, select {
            font-size: 16px;
        }

        /* 抖动动画 */
        @keyframes shakeHard {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-9px); }
            40% { transform: translateX(9px); }
            60% { transform: translateX(-5px); }
            80% { transform: translateX(5px); }
        }

        .shake-active {
            animation: shakeHard 0.4s ease-in-out;
        }

        /* 呼吸光晕 Logo */
        .logo-glow {
            position: relative;
        }
        .logo-glow::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 26px;
            background: linear-gradient(135deg, #10b981, #06b6d4);
            filter: blur(12px);
            opacity: 0.6;
            z-index: -1;
            animation: pulseGlow 3s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.4; transform: scale(0.96); }
            100% { opacity: 0.8; transform: scale(1.04); }
        }
    </style>
    <link rel="stylesheet" href="css/dynamic-backgrounds.css">

</head>

<body>
    <div id="login-scene" aria-hidden="true"></div>
    <div class="background-picker">
        <i class="fas fa-magic"></i>
        <span>动效</span>
        <!-- 选项由 DynamicBackground.fillOptions 自动填充，与播放页设置保持一致 -->
        <select id="login-background" class="bg-picker-select" aria-label="选择登录页动态效果"></select>
    </div>

    <div class="bg-grid-mask"></div>
    <div id="cursor-glow"></div>

    <!-- 左上方精美主题切换 Toggle -->
    <button type="button" onclick="toggleTheme()" class="theme-toggle-btn" id="theme-toggle-btn" title="切换亮色/暗色主题">
        <div class="theme-icon-box">
            <i class="fas fa-sun theme-icon icon-sun text-sm"></i>
            <i class="fas fa-moon theme-icon icon-moon text-sm"></i>
        </div>
        <span id="theme-label" class="text-xs font-semibold tracking-wide">暗色模式</span>
    </button>

    <!-- 主登录卡片 -->
    <div class="relative z-10 glass-card rounded-3xl p-8 sm:p-10 w-full max-w-[430px] mx-4 transition-all duration-500" id="auth-card">
        
        <!-- Header: Logo & Title -->
        <div class="text-center mb-7">
            <div class="logo-glow w-16 h-16 rounded-2xl mx-auto mb-3.5 flex items-center justify-center bg-gradient-to-br from-emerald-400 to-teal-600 shadow-xl shadow-emerald-500/20 transform hover:scale-105 transition-all duration-300">
                <i class="fas fa-music text-white text-2xl drop-shadow-md"></i>
            </div>
            <h1 class="card-title text-2xl sm:text-[26px] font-black tracking-tight mb-1.5 flex items-center justify-center transition-colors" id="music-login-title">
                LX Music Web
            </h1>
            <p id="mode-desc" class="text-xs text-gray-400 transition-all duration-300">登录账号以同步本地与云端歌单</p>
        </div>

        <!-- 模式切换选择器 (Segmented Control) -->
        <div class="relative segmented-bg p-1 rounded-2xl mb-6 flex items-center justify-between transition-colors">
            <div id="tab-pill" class="tab-pill left-[4px]"></div>
            
            <button type="button" onclick="switchLoginMode('user')" id="btn-tab-user"
                class="tab-btn w-1/2 py-2.5 text-xs sm:text-[13px] font-bold text-white flex items-center justify-center gap-2 rounded-xl focus:outline-none">
                <i class="fas fa-user-circle"></i>
                <span>用户账号登录</span>
            </button>

            <button type="button" onclick="switchLoginMode('player')" id="btn-tab-player"
                class="tab-btn w-1/2 py-2.5 text-xs sm:text-[13px] font-bold text-gray-400 flex items-center justify-center gap-2 rounded-xl focus:outline-none hover:text-gray-200">
                <i class="fas fa-key"></i>
                <span>播放器访问密码</span>
            </button>
        </div>

        <!-- 表单区域 -->
        <select id="auth-mode-input" onchange="updateLoginMode()" aria-label="登录方式" class="hidden">
            <option value="user">账号登录</option>
            <option value="player">播放器访问密码</option>
        </select>
        <input type="hidden" id="auth-password-input">
        <form onsubmit="handleLogin(event)" id="login-form" class="space-y-4">
            
            <!-- 用户账号模式表单 -->
            <div id="user-mode-panel" class="form-panel active-panel space-y-4">
                <!-- 账号输入框（无预填、无多余提示） -->
                <div class="input-wrapper">
                    <input type="text" id="auth-username-input" placeholder="输入账号 / 用户名"
                        class="modern-input" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
                    <i class="fas fa-user input-icon"></i>
                </div>

                <!-- 用户密码输入框 -->
                <div class="input-wrapper">
                    <input type="password" id="auth-user-password-input" placeholder="输入密码"
                        class="modern-input" autocomplete="current-password">
                    <i class="fas fa-lock input-icon"></i>
                    <button type="button" onclick="togglePasswordVisibility('auth-user-password-input', this)" class="input-action-btn" title="显示/隐藏密码">
                        <i class="far fa-eye"></i>
                    </button>
                </div>
            </div>

            <!-- 播放器密码模式表单 (Guest/Player Password Only) -->
            <div id="player-mode-panel" class="form-panel hidden-panel space-y-4">
                <!-- 播放器访问密码输入框 -->
                <div class="input-wrapper">
                    <input type="password" id="auth-player-password-input" placeholder="输入播放器访问密码"
                        class="modern-input" autocomplete="current-password">
                    <i class="fas fa-shield-alt input-icon"></i>
                    <button type="button" onclick="togglePasswordVisibility('auth-player-password-input', this)" class="input-action-btn" title="显示/隐藏密码">
                        <i class="far fa-eye"></i>
                    </button>
                </div>
                <p class="sub-text text-[11.5px] text-gray-400/80 px-1 leading-relaxed">
                    <i class="fas fa-info-circle text-emerald-500 mr-1"></i> 无需账号，输入访问密码直接进入播放器。
                </p>
            </div>

            <!-- 错误提示框 -->
            <div id="auth-error" class="hidden text-rose-300 text-xs text-center bg-rose-950/50 border border-rose-500/30 py-2.5 px-4 rounded-xl flex items-center justify-center gap-2 shadow-lg shadow-rose-950/40">
                <i class="fas fa-exclamation-circle text-rose-400 flex-shrink-0"></i>
                <span id="auth-error-msg">账号或密码错误</span>
            </div>

            <!-- 登录提交按钮 -->
            <button type="submit" id="submit-btn"
                class="btn-gradient-submit w-full py-3.5 mt-2 text-white font-bold rounded-xl text-sm flex items-center justify-center gap-2 shadow-lg focus:outline-none">
                <i class="fas fa-sign-in-alt"></i>
                <span id="submit-btn-text">登录账号</span>
            </button>
        </form>

        <!-- 底部说明与快捷帮助 -->
        <div class="mt-7 pt-4 border-t border-black/5 dark:border-white/5 flex items-center justify-between text-[11.5px] text-gray-500">
            <span id="footer-tip">请联系系统管理员获取凭据</span>
            <button type="button" onclick="clearSavedSessions()" class="hover:text-emerald-500 dark:hover:text-gray-300 transition-colors focus:outline-none" title="清理保存在本机的已存凭据">
                <i class="fas fa-trash-alt mr-1"></i>重置本地凭据
            </button>
        </div>
    </div>

    <script>
        let currentMode = 'user';

        // ===== 主题管理 (Theme Management) =====
        function applyTheme(theme) {
            const html = document.documentElement;
            if (!html || !html.classList) return;
            const themeLabel = document.getElementById('theme-label');
            if (theme === 'light') {
                html.classList.remove('theme-dark');
                html.classList.add('theme-light');
                if (themeLabel) themeLabel.textContent = '亮色模式';
            } else {
                html.classList.remove('theme-light');
                html.classList.add('theme-dark');
                if (themeLabel) themeLabel.textContent = '暗色模式';
            }
            try { localStorage.setItem('lx_web_theme', theme); } catch { }
            updateTabPillTextColor();
        }

        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html?.classList?.contains ? html.classList.contains('theme-dark') : true;
            applyTheme(isDark ? 'light' : 'dark');
        }

        function initTheme() {
            const saved = typeof localStorage?.getItem === 'function' ? localStorage.getItem('lx_web_theme') : null;
            if (saved === 'light' || saved === 'dark') {
                applyTheme(saved);
            } else {
                const prefersDark = typeof window?.matchMedia === 'function' && window.matchMedia('(prefers-color-scheme: dark)').matches;
                applyTheme(prefersDark ? 'dark' : 'light');
            }
        }

        function updateTabPillTextColor() {
            const html = document.documentElement;
            const isLight = html?.classList?.contains ? html.classList.contains('theme-light') : false;
            const btnUser = document.getElementById('btn-tab-user');
            const btnPlayer = document.getElementById('btn-tab-player');
            if (!btnUser || !btnPlayer) return;
            if (currentMode === 'user') {
                btnUser.className = 'tab-btn w-1/2 py-2.5 text-xs sm:text-[13px] font-bold text-white flex items-center justify-center gap-2 rounded-xl focus:outline-none';
                btnPlayer.className = 'tab-btn w-1/2 py-2.5 text-xs sm:text-[13px] font-bold ' + (isLight ? 'text-gray-500 hover:text-gray-800' : 'text-gray-400 hover:text-gray-200') + ' flex items-center justify-center gap-2 rounded-xl focus:outline-none';
            } else {
                btnPlayer.className = 'tab-btn w-1/2 py-2.5 text-xs sm:text-[13px] font-bold text-white flex items-center justify-center gap-2 rounded-xl focus:outline-none';
                btnUser.className = 'tab-btn w-1/2 py-2.5 text-xs sm:text-[13px] font-bold ' + (isLight ? 'text-gray-500 hover:text-gray-800' : 'text-gray-400 hover:text-gray-200') + ' flex items-center justify-center gap-2 rounded-xl focus:outline-none';
            }
        }

        function switchLoginMode(mode) {
            const modeInput = document.getElementById('auth-mode-input');
            if (modeInput) modeInput.value = mode;
            updateLoginMode();
            const target = document.getElementById(mode === 'player' ? 'auth-player-password-input' : 'auth-username-input');
            if (target) target.focus();
        }

        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            if (!input) return;
            const isPass = input.type === 'password';
            input.type = isPass ? 'text' : 'password';
            const icon = btn.querySelector('i');
            if (icon) {
                icon.className = isPass ? 'far fa-eye-slash' : 'far fa-eye';
            }
        }

        function clearSavedSessions() {
            for (const key of ['lx_sync_user', 'lx_sync_pass', 'lx_user_token', 'lx_player_pass', 'lx_login_mode']) {
                try { localStorage.removeItem(key); } catch { }
            }
            const tip = document.getElementById('footer-tip');
            if (tip) {
                const originalText = tip.textContent;
                tip.textContent = '已清理本机已保存凭据';
                tip.classList.add('text-emerald-500');
                setTimeout(() => {
                    tip.textContent = originalText;
                    tip.classList.remove('text-emerald-500');
                }, 2500);
            }
        }

        function showError(msg) {
            const errorDiv = document.getElementById('auth-error');
            const errorMsg = document.getElementById('auth-error-msg');
            if (errorDiv?.classList) errorDiv.classList.remove('hidden');
            if (errorMsg) errorMsg.textContent = msg;
        }

        function shakeCard(card) {
            if (!card?.classList) return;
            card.classList.remove('shake-active');
            void (card.offsetWidth || 0);
            card.classList.add('shake-active');
            setTimeout(() => card.classList.remove('shake-active'), 450);
        }

        (async () => {
            if (typeof initTheme === 'function') initTheme();


            const now = Date.now();
            const lastBounce = parseInt(sessionStorage.getItem('lx_login_bounce_time') || '0', 10);
            const previousCount = parseInt(sessionStorage.getItem('lx_login_bounce_cnt') || '0', 10);
            const bounceCount = now - lastBounce < 5000 ? previousCount + 1 : 0;
            sessionStorage.setItem('lx_login_bounce_time', String(now));
            sessionStorage.setItem('lx_login_bounce_cnt', String(bounceCount));

            if (bounceCount >= 2) {
                console.warn('[Login] 检测到连续重定向，已停止自动恢复，请在当前页面重新登录。');
                sessionStorage.removeItem('lx_login_bounce_time');
                sessionStorage.removeItem('lx_login_bounce_cnt');
                return;
            }

            const setPlayerName = (name) => {
                if (!name || typeof document === 'undefined') return;
                document.title = name + ' - 登录';
                if (typeof document.getElementById === 'function') {
                    const titleEl = document.getElementById('music-login-title');
                    if (titleEl) titleEl.textContent = name;
                }
            };
            if (typeof window !== 'undefined' && window.CONFIG && window.CONFIG['player.name']) {
                setPlayerName(window.CONFIG['player.name']);
            }

            try {
                const res = await fetch('/api/music/config');
                const cfg = await res.json();
                if (cfg && cfg['player.name']) {
                    setPlayerName(cfg['player.name']);
                }
                if (cfg && !cfg['player.enableAuth']) {
                    window.location.replace('./');
                    return;
                }

                const savedToken = localStorage.getItem('lx_user_token');
                const verifyRes = await fetch('/api/music/auth/verify', {
                    headers: savedToken ? { 'x-user-token': savedToken } : undefined
                });
                const verifyData = await verifyRes.json();
                if (verifyData && verifyData.valid) {
                    window.location.replace('./');
                    return;
                }

                // Safari 凭据恢复
                const savedMode = localStorage.getItem('lx_login_mode') === 'player' ? 'player' : 'user';
                const savedUser = localStorage.getItem('lx_sync_user');
                const savedPass = localStorage.getItem(savedMode === 'player' ? 'lx_player_pass' : 'lx_sync_pass');
                if ((savedMode === 'player' || savedUser) && savedPass) {
                    console.log('[Login] 检测到已保存凭据，正在恢复 Session...');
                    const autoRes = await fetch('/api/music/auth', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: savedMode === 'player' ? '' : savedUser, password: savedPass, mode: savedMode })
                    });
                    const autoData = await autoRes.json();
                    if (autoData && autoData.success) {
                        rememberLocalLogin(autoData, savedPass);
                        window.location.replace('./');
                    }
                }
            } catch (e) {
                console.error('[Login] 初始化检查失败:', e);
            }
        })();

        function rememberLocalLogin(data, password) {
            if (data.mode === 'player') {
                localStorage.setItem('lx_login_mode', 'player');
                localStorage.setItem('lx_player_pass', password);
                for (const key of ['lx_sync_user', 'lx_sync_pass', 'lx_user_token']) localStorage.removeItem(key);
                if (localStorage.getItem('lx_sync_mode') === 'local') localStorage.removeItem('lx_sync_mode');
                return;
            }
            if (!data.username) return;
            localStorage.setItem('lx_login_mode', 'user');
            localStorage.removeItem('lx_player_pass');
            localStorage.setItem('lx_sync_user', data.username);
            localStorage.setItem('lx_sync_pass', password);
            localStorage.setItem('lx_sync_mode', 'local');
            if (data.token) localStorage.setItem('lx_user_token', data.token);
        }

        function updateLoginMode() {
            const modeInput = document.getElementById('auth-mode-input');
            const playerMode = (modeInput ? modeInput.value : (typeof currentMode !== 'undefined' ? currentMode : 'user')) === 'player';
            currentMode = playerMode ? 'player' : 'user';

            const userPanel = document.getElementById('user-mode-panel');
            const playerPanel = document.getElementById('player-mode-panel');
            const usernameField = document.getElementById('auth-username-field');
            if (usernameField?.classList) usernameField.classList.toggle('hidden', playerMode);
            if (userPanel?.classList) {
                userPanel.classList.toggle('hidden-panel', playerMode);
                userPanel.classList.toggle('active-panel', !playerMode);
            }
            if (playerPanel?.classList) {
                playerPanel.classList.toggle('hidden-panel', !playerMode);
                playerPanel.classList.toggle('active-panel', playerMode);
            }

            const username = document.getElementById('auth-username-input');
            if (username) {
                username.required = !playerMode;
                username.disabled = playerMode;
            }
            const modeDesc = document.getElementById('mode-desc');
            if (modeDesc) {
                modeDesc.textContent = playerMode ? '输入播放器访问密码直接进入播放器' : '登录账号以同步本地与云端歌单';
            }
            const submitBtnText = document.getElementById('submit-btn-text');
            if (submitBtnText) {
                submitBtnText.textContent = playerMode ? '进入播放器' : '登录账号';
            }
            const tabPill = document.getElementById('tab-pill');
            if (tabPill?.style) {
                tabPill.style.transform = playerMode ? 'translateX(100%)' : 'translateX(0)';
            }
            if (typeof updateTabPillTextColor === 'function') {
                try { updateTabPillTextColor(); } catch { }
            }
        }

        async function handleLogin(event) {
            if (event && event.preventDefault) event.preventDefault();
            const modeInput = document.getElementById('auth-mode-input');
            const mode = (modeInput ? modeInput.value : currentMode) === 'player' ? 'player' : 'user';
            const usernameInput = document.getElementById('auth-username-input');
            const username = mode === 'player' ? '' : (usernameInput ? usernameInput.value.trim() : '');
            
            const passInput = document.getElementById('auth-password-input');
            const userPassInput = document.getElementById('auth-user-password-input');
            const playerPassInput = document.getElementById('auth-player-password-input');
            const password = (passInput && passInput.value) || 
                (mode === 'user' ? (userPassInput ? userPassInput.value : '') : (playerPassInput ? playerPassInput.value : ''));

            const errorDiv = document.getElementById('auth-error');
            const errorMsg = document.getElementById('auth-error-msg');
            const submitBtn = document.getElementById('submit-btn');
            const submitBtnText = document.getElementById('submit-btn-text');
            const card = document.getElementById('auth-card');

            if (!password || (mode === 'user' && !username)) return;

            if (submitBtn) submitBtn.disabled = true;
            if (submitBtnText) submitBtnText.textContent = '验证凭据中...';
            if (errorDiv) errorDiv.classList.add('hidden');

            try {
                const res = await fetch('/api/music/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, mode })
                });
                const data = await res.json();

                if (data.success) {
                    sessionStorage.removeItem('lx_login_bounce_time');
                    sessionStorage.removeItem('lx_login_bounce_cnt');
                    if (submitBtnText) submitBtnText.textContent = '验证成功，正在进入...';
                    if (submitBtn) {
                        submitBtn.classList.remove('btn-gradient-submit');
                        submitBtn.classList.add('bg-emerald-500');
                    }
                    rememberLocalLogin(data, password);
                    if (card) {
                        card.style.transform = 'scale(0.95)';
                        card.style.opacity = '0.4';
                    }
                    setTimeout(() => window.location.replace('./'), 260);
                } else {
                    showError(data.message || (mode === 'user' ? '账号或密码错误' : '播放器访问密码错误'));
                    shakeCard(card);
                    if (submitBtn) submitBtn.disabled = false;
                    if (submitBtnText) submitBtnText.textContent = mode === 'user' ? '登录账号' : '进入播放器';
                }
            } catch (e) {
                console.error('[Login] 请求失败:', e);
                showError('网络连接异常，请检查服务端状态');
                shakeCard(card);
                if (submitBtn) submitBtn.disabled = false;
                if (submitBtnText) submitBtnText.textContent = mode === 'user' ? '登录账号' : '进入播放器';
            }
        }
        const handleLoginSubmit = handleLogin;

        if (typeof document?.getElementById === 'function') {
            const cursorGlow = document.getElementById('cursor-glow');
            if (cursorGlow && typeof window?.addEventListener === 'function') {
                window.addEventListener('mousemove', (e) => {
                    cursorGlow.style.left = e.clientX + 'px';
                    cursorGlow.style.top = e.clientY + 'px';
                });
            }
        }

        if (typeof document?.addEventListener === 'function') {
            document.addEventListener('DOMContentLoaded', () => {
                if (typeof document?.getElementById !== 'function') return;
                const modeInput = document.getElementById('auth-mode-input');
                const savedMode = localStorage.getItem('lx_login_mode') === 'player' ? 'player' : 'user';
                if (modeInput) modeInput.value = savedMode;
                updateLoginMode();
                const target = document.getElementById(savedMode === 'player' ? 'auth-player-password-input' : 'auth-username-input');
                if (target) target.focus();
            });
        }
</script>
    <script src="js/ui/dynamic_backgrounds.js"></script>
    
</body>
